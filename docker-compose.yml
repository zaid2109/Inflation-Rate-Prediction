version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./models:/app/models
      - ./data/processed:/app/data/processed
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
    command: >
      mlflow server
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root /mlflow/mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

  dashboard:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
    volumes:
      - .:/app
    command: >
      bash -c "pip install -q streamlit plotly pandas numpy joblib tensorflow requests &&
               streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501"
    depends_on:
      - api
    restart: unless-stopped
